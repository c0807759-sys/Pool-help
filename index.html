<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0c1a14">
<title>Pool Drill Tracker</title>
<style>
:root{--bg:#0c1a14;--card:#14271f;--line:#24453a;--felt:#1f6b4a;--text:#eef5f1;--mute:#93ab9f;--acc:#f4c542;--good:#3ddc84;--bad:#ff5a5a;--blue:#5ab4ff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:15px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;overscroll-behavior:none}
button{font:inherit;color:inherit;background:#22423a;border:1px solid #2f5a4d;border-radius:12px;padding:10px 14px;cursor:pointer}
button.primary{background:var(--acc);color:#1a1400;border-color:var(--acc);font-weight:700}
button.good{background:#1d5e3c;border-color:#2c8a59}
button.bad{background:#5e1d1d;border-color:#8a2c2c}
button:active{transform:scale(.97)}
select,input[type=range]{font:inherit}
select{background:#22423a;color:var(--text);border:1px solid #2f5a4d;border-radius:10px;padding:8px}
.hidden{display:none!important}
.screen{position:fixed;inset:0;overflow:auto}
#home,#stats{padding:calc(env(safe-area-inset-top) + 14px) 16px calc(env(safe-area-inset-bottom) + 30px)}
.wrap{max-width:760px;margin:0 auto}
h1{font-size:24px;margin:4px 0 2px}
h2{font-size:17px;margin:22px 0 10px;color:var(--acc)}
.sub{color:var(--mute);margin:0 0 6px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}
.tips li{margin:4px 0;color:#cfe0d7}
.drills{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.drill{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px;cursor:pointer;text-align:left}
.drill svg{width:100%;height:auto;display:block;margin-bottom:8px}
.drill .n{font-weight:700}
.drill .d{color:var(--mute);font-size:13px;margin-top:2px}
.drill .s{font-size:13px;margin-top:6px;color:var(--acc)}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row label{flex:1}
.toprow{display:flex;justify-content:space-between;align-items:center}
/* run screen */
#run{overflow:hidden;background:#000;touch-action:none}
#video{position:absolute;width:2px;height:2px;opacity:0;pointer-events:none}
#view{position:absolute;inset:0;width:100%;height:100%}
#topbar{position:absolute;left:0;right:0;top:0;padding:calc(env(safe-area-inset-top) + 8px) 10px 8px;display:flex;align-items:center;gap:10px;background:linear-gradient(#000c,#0000);pointer-events:none}
#topbar>*{pointer-events:auto}
#topbar .title{flex:1;min-width:0}
#drillName{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#score{color:var(--acc);font-size:14px}
#status{background:#000a;border:1px solid #fff3;border-radius:20px;padding:6px 12px;font-size:13px;white-space:nowrap}
#status.ready{background:#1d5e3c;border-color:var(--good)}
#status.track{background:#5e4a10;border-color:var(--acc)}
#mini{position:absolute;right:10px;top:calc(env(safe-area-inset-top) + 58px);width:200px;height:100px;border:2px solid #fff5;border-radius:8px;background:#000;image-rendering:pixelated}
#miniLabel{position:absolute;right:14px;top:calc(env(safe-area-inset-top) + 160px);font-size:11px;color:#fffa;text-shadow:0 1px 2px #000}
#panel{position:absolute;left:10px;bottom:calc(env(safe-area-inset-bottom) + 70px);max-width:min(520px,calc(100% - 20px));background:#000c;border:1px solid #fff2;border-radius:14px;padding:12px;backdrop-filter:blur(6px)}
#panel p{margin:0 0 8px}
#panel .btns{display:flex;flex-wrap:wrap;gap:8px}
#panel .warn{color:#ffd27a;font-size:13px;margin:6px 0 0}
#panel .warn.bad{color:#ff8b8b}
#controls{position:absolute;left:0;right:0;bottom:0;padding:8px 10px calc(env(safe-area-inset-bottom) + 10px);display:flex;gap:8px;justify-content:center;background:linear-gradient(#0000,#000c)}
#controls button{min-width:64px}
#flash{position:absolute;left:50%;top:42%;transform:translate(-50%,-50%);font-size:64px;font-weight:900;text-shadow:0 4px 18px #000;pointer-events:none;opacity:0;transition:opacity .25s;text-align:center;line-height:1}
#flash small{display:block;font-size:20px;font-weight:600;margin-top:8px}
#flash.show{opacity:1}
.modal
